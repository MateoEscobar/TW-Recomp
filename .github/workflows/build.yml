name: CI Build

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config \
            xorg-dev \
            libasound2-dev

      - name: Set up MSVC x64 environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/ThirdParty
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS2X_ENABLE_SCCACHE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Package Windows release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $staging = "dist\TW-Recomp"
          cmake --install build --prefix $staging
          # Rename executable to the user-facing name
          Move-Item -Force "$staging\bin\ps2EntryRunner.exe" "$staging\bin\TW-Recomp.exe"
          Copy-Item "games\warriors\config.ini.template" "$staging\bin\"
          Copy-Item "README.md" "$staging\bin\"
          $zip = "TW-Recomp-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path "$staging\bin\*" -DestinationPath $zip -Force
          Write-Host "==> $zip"

      - name: Upload Windows artifact
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: TW-Recomp-windows-${{ github.ref_name }}
          path: TW-Recomp-${{ github.ref_name }}-windows.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: TW-Recomp-Linux-${{ github.ref_name }}
          path: |
            build/ps2xRuntime/ps2EntryRunner
            build/ps2xRecomp/ps2xRecomp/ps2_recomp
            build/ps2xAnalyzer/ps2_analyzer
