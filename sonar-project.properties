sonar.projectKey=TWR
sonar.projectName=warriors-recomp
sonar.projectVersion=0.1.0

# Sources
# [TWR-29] Del submódulo solo se analiza lo que este port compila y mantiene (ps2xRecomp y
# ps2xIOP, este último modificado en el fork). ps2xRecomp/ps2xRuntime es el runtime de
# referencia upstream del que se portan patrones (ps2_iop_host.cpp, ps2_iop_transport.h): no se
# construye aquí y analizarlo solo marcaba el port como duplicado de su original.
sonar.sources=ps2xAnalyzer/src,ps2xRuntime/src,ps2xRecomp/ps2xRecomp,ps2xRecomp/ps2xIOP,tools
# [TWR-29] ps2xRuntime/src/runner/** y runner_overlay/** son las ~16 000 fuentes generadas por
# ps2xRecomp (código máquina traducido, no se editan a mano): el reporte pesaba 621 MB y el
# Compute Engine del servidor moría con "Java heap space" al extraerlo.
sonar.exclusions=build/**,**/third_party/**,**/_deps/**,games/**,textures/**,mods/**,docs/**,**/*.pb.cc,**/*.pb.h,**/*.suprx,**/*.ttf,**/*.java,**/*.py,scripts/**,ps2xRuntime/src/runner/**,ps2xRuntime/src/runner_overlay/**,ps2xRuntime/include/ps2_recompiled_functions.h,ps2xRuntime/include/ps2_recompiled_stubs.h
sonar.inclusions=**/*.cpp,**/*.cxx,**/*.cc,**/*.c,**/*.h,**/*.hpp,**/*.hxx

# C++ configuration (sonar-cxx)
sonar.cxx.file.suffixes=.cpp,.cxx,.cc,.c,.h,.hpp,.hxx
sonar.cxx.compiledb.reportPaths=build/compile_commands.json

# Host
sonar.host.url=http://localhost:9009
# sonar.token se pasa por línea de comandos, no se commitea aquí

# Encoding
sonar.sourceEncoding=UTF-8
