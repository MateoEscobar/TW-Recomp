sonar.projectKey=TWR
sonar.projectName=warriors-recomp
sonar.projectVersion=0.1.0

# Sources
# [TWR-27 decisión 23] El runtime ya no vive en el repo (PS2Recomp se clona y parchea en local): se analiza solo
# el código propio del port (src/, tools/). Los parches (patches/) son diffs, no fuentes.
sonar.sources=src,tools
sonar.exclusions=build/**,PS2Recomp/**,games/**,textures/**,mods/**,docs/**,patches/**,**/*.py,scripts/**,**/*.pb.cc,**/*.pb.h
sonar.inclusions=**/*.cpp,**/*.cxx,**/*.cc,**/*.c,**/*.h,**/*.hpp,**/*.hxx

# C++ configuration (sonar-cxx)
sonar.cxx.file.suffixes=.cpp,.cxx,.cc,.c,.h,.hpp,.hxx
sonar.cxx.compiledb.reportPaths=build/ps2recomp/compile_commands.json
# [TWR-27] Cabeceras del runtime parcheado (PS2Recomp se clona con scripts/build-linux.sh): sin ellas el parser de
# sonar-cxx da un error de sintaxis en src/warriors_overrides.cpp. Los "include directive errors" restantes son de
# cabeceras de terceros anidadas y no afectan al análisis.
sonar.cxx.includeDirectories=PS2Recomp/ps2xRuntime/include,PS2Recomp/ps2xRuntime/src/lib,PS2Recomp/ps2xRuntime/src/lib/Kernel,PS2Recomp/ps2xIOP/include,build/ps2recomp/_deps/raylib-src/src,/usr/include,/usr/include/x86_64-linux-gnu,/usr/lib/gcc/x86_64-linux-gnu/13/include

# Host
sonar.host.url=http://localhost:9009
# sonar.token se pasa por línea de comandos, no se commitea aquí

# Encoding
sonar.sourceEncoding=UTF-8
